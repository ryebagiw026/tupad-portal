
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DOLE IV-A TUPAD Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #2563eb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 460px;
    }

    .login-card {
      background: #fff;
      padding: 44px 36px;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,.25);
    }

    .top-images {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .top-images img {
      max-height: 70px;
      max-width: 45%;
      width: auto;
      object-fit: contain;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .agency-title {
      font-size: 15px;
      font-weight: 700;
      color: #1e3a8a;
      letter-spacing: .5px;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .agency-subtitle {
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-top: 2px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .portal-title {
      font-size: 32px;
      font-weight: 900;
      color: #1e3a8a;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 8px;
      margin-bottom: 4px;
      line-height: 1.1;
    }

    .brand-header p {
      font-size: 14px;
      color: #64748b;
      margin-top: 12px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      color: #0f172a;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.15);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-submit:hover {
      background: #1d4ed8;
    }

    .btn-submit:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .alert {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 20px;
      display: none;
    }

    .alert-danger {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .alert-success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #94a3b8;
    }

    @media (max-width: 400px) {
      .login-card {
        padding: 32px 22px;
      }

      .agency-title {
        font-size: 12px;
        white-space: normal;
      }

      .portal-title {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">
    <div class="login-card">

      <div class="top-images">
        <img
          src="https://lh3.googleusercontent.com/d/1majYYQo6JLkJpTENRkhsDNfaO48C5yGS"
          alt="TUPAD Logo"
        >

        <img
          src="https://lh3.googleusercontent.com/d/1AfUMpkHAa7yiHyKsFs3X_BLKFbZ55_b5"
          alt="DOLE Logo"
        >
      </div>

      <div class="brand-header">
        <h1 class="agency-title">
          Department of Labor and Employment
        </h1>

        <div class="agency-subtitle">Region IV-A</div>

        <h2 class="portal-title">TUPAD PORTAL</h2>

        <p>Sign in to your account</p>
      </div>

      <div id="alertBox" class="alert" role="alert"></div>

      <form id="loginForm">

        <div class="form-group">
          <input
            type="text"
            id="username"
            required
            placeholder="Enter Username"
            autocomplete="username"
            aria-label="Username"
            autofocus
          >
        </div>

        <div class="form-group">
          <input
            type="password"
            id="password"
            required
            placeholder="Enter Password"
            autocomplete="current-password"
            aria-label="Password"
          >
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          Sign In
        </button>

      </form>

      <div class="footer-note">
        DOLE Region IV-A | TUPAD Portal
      </div>

    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');

    function showAlert(message, type) {
      alertBox.className = 'alert alert-' + type;
      alertBox.textContent = message;
      alertBox.style.display = 'block';
    }

    loginForm.addEventListener('submit', async function(event) {
      event.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      try {
        // Connect this endpoint to your secure authentication backend.
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            username: username,
            password: password
          })
        });

        const result = await response.json();

        if (response.ok && result.success) {

          showAlert(
            'Authentication successful! Redirecting...',
            'success'
          );

          // Store only non-sensitive session information.
          // Prefer a secure, HttpOnly cookie managed by your backend.
          window.location.href = result.redirectUrl || 'dashboard.html';

        } else {
          showAlert(
            result.message || 'Invalid username or password.',
            'danger'
          );

          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }

      } catch (error) {
        showAlert(
          'Unable to connect to the authentication server. Please try again.',
          'danger'
        );

        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';

        console.error('Login error:', error);
      }
    });
  </script>

</body>
</html>
